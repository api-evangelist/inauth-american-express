name: InAuth (American Express)
description: 'InAuth is a mobile-first digital device intelligence and authentication
  company acquired by American Express in 2018 and now operated within American Express''s
  fraud-management portfolio; its technology also powers Accertify Device Intelligence.
  The InAuth Security Platform provides persistent device identification (device fingerprinting),
  malware and criminal-tool detection, rooted/jailbroken-device detection, location
  and behavioral risk analysis, and transaction risk scoring, delivered primarily
  through native iOS and Android SDKs embedded in merchant and financial-institution
  apps. Access is enterprise-gated through the Amex for Developers portal; there is
  no public self-serve REST API, OpenAPI specification, public package-registry distribution,
  or InAuth-specific public code repository for the product line.'
